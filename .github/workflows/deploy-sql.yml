name: Aplicar Script SQL a Azure

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'proyecto-air.sql'

  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escriba SI para confirmar la ejecucion manual'
        required: true
        default: 'NO'

jobs:
  aplicar-sql:
    name: Ejecutar proyecto-air.sql en Azure
    runs-on: ubuntu-latest

    if: github.event_name == 'push' || github.event.inputs.confirmar == 'SI'

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Mostrar informacion del trigger
        run: |
          echo "Disparado por: ${{ github.actor }}"
          echo "Evento: ${{ github.event_name }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

      - name: Instalar sqlcmd (Go version)
        run: |
          curl -L -o go-sqlcmd.tar.bz2 https://github.com/microsoft/go-sqlcmd/releases/download/v1.6.0/sqlcmd-v1.6.0-linux-x64.tar.bz2
          tar -xvjf go-sqlcmd.tar.bz2
          sudo mv sqlcmd /usr/local/bin/
          sqlcmd --version

      - name: Verificar conexion a Azure SQL
        env:
          DB_SERVER:   ${{ secrets.AZURE_DB_SERVER }}
          DB_NAME:     ${{ secrets.AZURE_DB_NAME }}
          DB_USER:     ${{ secrets.AZURE_DB_USER }}
          DB_PASSWORD: ${{ secrets.AZURE_DB_PASSWORD }}
        run: |
          sqlcmd \
            -S "$DB_SERVER" \
            -d "$DB_NAME" \
            -U "$DB_USER" \
            -P "$DB_PASSWORD" \
            -Q "SELECT @@VERSION AS version, DB_NAME() AS bd, SUSER_SNAME() AS usuario;" \
            -C \
            -l 60

      - name: Verificar que proyecto-air.sql tiene contenido
        run: |
          if [ ! -s proyecto-air.sql ]; then
            echo "::warning::El archivo proyecto-air.sql esta vacio. Saltando ejecucion."
            echo "SKIP_DEPLOY=true" >> $GITHUB_ENV
          else
            echo "Archivo con $(wc -l < proyecto-air.sql) lineas. Procediendo con deploy."
            echo "SKIP_DEPLOY=false" >> $GITHUB_ENV
          fi

      - name: Ejecutar proyecto-air.sql
        if: env.SKIP_DEPLOY == 'false'
        env:
          DB_SERVER:   ${{ secrets.AZURE_DB_SERVER }}
          DB_NAME:     ${{ secrets.AZURE_DB_NAME }}
          DB_USER:     ${{ secrets.AZURE_DB_USER }}
          DB_PASSWORD: ${{ secrets.AZURE_DB_PASSWORD }}
        run: |
          echo "Ejecutando proyecto-air.sql contra $DB_SERVER..."

          sqlcmd \
            -S "$DB_SERVER" \
            -d "$DB_NAME" \
            -U "$DB_USER" \
            -P "$DB_PASSWORD" \
            -i proyecto-air.sql \
            -C \
            -l 60 \
            -b

          echo "Script ejecutado exitosamente."

      - name: Validar estado final de la BD
        if: env.SKIP_DEPLOY == 'false'
        env:
          DB_SERVER:   ${{ secrets.AZURE_DB_SERVER }}
          DB_NAME:     ${{ secrets.AZURE_DB_NAME }}
          DB_USER:     ${{ secrets.AZURE_DB_USER }}
          DB_PASSWORD: ${{ secrets.AZURE_DB_PASSWORD }}
        run: |
          sqlcmd \
            -S "$DB_SERVER" \
            -d "$DB_NAME" \
            -U "$DB_USER" \
            -P "$DB_PASSWORD" \
            -Q "SELECT COUNT(*) AS total_tablas FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_TYPE = 'BASE TABLE'; SELECT COUNT(*) AS total_triggers FROM sys.triggers;" \
            -C

      - name: Reporte de exito
        if: success()
        run: |
          echo "## Deploy exitoso" >> $GITHUB_STEP_SUMMARY
          echo "El script proyecto-air.sql se ejecuto correctamente sobre Azure SQL Database." >> $GITHUB_STEP_SUMMARY
          echo "**Disparado por:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: Reporte de falla
        if: failure()
        run: |
          echo "## Deploy fallo" >> $GITHUB_STEP_SUMMARY
          echo "El script no pudo ejecutarse sobre Azure. Revisa los logs arriba." >> $GITHUB_STEP_SUMMARY